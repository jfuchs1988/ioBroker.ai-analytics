<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="../../css/adapter.css" />
    <style>
        body { font-family: sans-serif; margin: 0; }
        #nav { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid #ddd; }
        .nav-btn { padding: 6px 14px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; }
        .nav-btn.active { background: #1976d2; color: #fff; border-color: #1976d2; }
        .section[hidden] { display: none; }
        #chat-messages { height: 70vh; overflow-y: auto; padding: 12px; box-sizing: border-box; }
        .chat-message { display: flex; flex-direction: column; margin-bottom: 8px; }
        .chat-message-user { align-items: flex-end; }
        .chat-message-assistant { align-items: flex-start; }
        .chat-bubble { max-width: 70%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
        .chat-message-user .chat-bubble { background: #1976d2; color: #fff; }
        .chat-message-assistant .chat-bubble { background: #eee; color: #222; }
        .chat-timestamp { font-size: 11px; color: #888; margin-top: 2px; }
        #chat-input-row { display: flex; padding: 8px; border-top: 1px solid #ddd; }
        #chat-input { flex: 1; padding: 8px; }
        #chat-send { padding: 8px 16px; margin-left: 8px; }
        #devices-toolbar { display: flex; gap: 8px; padding: 8px; align-items: center; }
        #devices-status { padding: 0 8px 8px; font-size: 13px; color: #555; }
        #devices-table { width: 100%; border-collapse: collapse; }
        #devices-table th, #devices-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
        tr.device-inactive { opacity: 0.5; }
        tr.device-ignored { font-style: italic; }
        #budget-range-toolbar { display: flex; gap: 4px; padding: 8px 0; }
        .range-btn { padding: 4px 10px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; }
        .range-btn.active { background: #1976d2; color: #fff; border-color: #1976d2; }
        #budget-chart { display: flex; align-items: flex-end; gap: 2px; height: 120px; padding: 8px; border: 1px solid #eee; overflow-x: auto; }
        .budget-bar { flex: 1; background: #1976d2; min-width: 2px; }
        #budget-cost-line, #budget-recommendation-line { padding: 4px 8px; font-size: 13px; color: #555; }
    </style>
    <script type="text/javascript" src="../../lib/js/jquery-3.5.1.min.js"></script>
    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>
    <script type="text/javascript" src="tab.js"></script>
</head>
<body>
    <div id="nav">
        <button class="nav-btn active" data-section="chat">Chat</button>
        <button class="nav-btn" data-section="devices">Geräte</button>
        <button class="nav-btn" data-section="budget">Budget</button>
    </div>

    <div id="section-chat" class="section">
        <div id="chat-messages"></div>
        <div id="chat-input-row">
            <input id="chat-input" type="text" placeholder="Frage stellen..." />
            <button id="chat-send">Senden</button>
        </div>
    </div>

    <div id="section-devices" class="section" hidden>
        <div id="devices-toolbar">
            <button id="devices-rescan">Geräte neu einlesen</button>
            <button id="devices-check-now">Prüfung jetzt ausführen</button>
            <input id="devices-filter" type="text" placeholder="Filtern nach Kategorie, Raum, Status..." />
        </div>
        <div id="devices-status"></div>
        <table id="devices-table">
            <thead>
                <tr><th>Objekt-ID</th><th>Beschreibung</th><th>Kategorie</th><th>Verhalten</th><th>Einheit</th><th>Raum</th><th>Status</th><th>Aktionen</th></tr>
            </thead>
            <tbody id="devices-tbody"></tbody>
        </table>
    </div>

    <div id="section-budget" class="section" hidden>
        <div id="budget-display">Lade...</div>
        <div id="budget-range-toolbar">
            <button id="budget-range-30" class="range-btn active">30 Tage</button>
            <button id="budget-range-all" class="range-btn">Gesamt</button>
        </div>
        <div id="budget-chart"></div>
        <div id="budget-cost-line"></div>
        <div id="budget-recommendation-line"></div>
    </div>
</body>
</html>
